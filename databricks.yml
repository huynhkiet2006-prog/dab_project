# This is a Databricks asset bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 849cba0c-1f1a-45f3-80fb-cb2618b2259f

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: "citibike_dev"
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true  
    workspace:
      host: https://adb-7405619617409523.3.azuredatabricks.net
    variables:
     # catalog: dbo
      schema: dev
    presets:
      artifacts_dynamic_version: true

  test:
    mode: production
    presets:
      name_prefix: '[test] '
    workspace:
      host: https://adb-7405618358391088.8.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/favoritostrife1082@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: 
        default: "citibike_test"
      schema: prod
    permissions:
      - user_name: favoritostrife1082@hotmail.com
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://adb-7405612786034434.14.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/favoritostrife1082@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default : "citibike_pro"
      schema: prod
    permissions:
      - user_name: favoritostrife1082@hotmail.com
        level: CAN_MANAGE
